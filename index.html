<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waktu Solat Malaysia</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#FAF7F0;color:#1A1A1A;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.wrap{width:100%;max-width:480px}
header{text-align:center;padding:8px 0 12px}
header h1{font-size:1.25rem;font-weight:700;color:#0F766E}
header .subtitle{font-size:.8125rem;color:#555;margin-top:2px}
header .hijri{font-size:.875rem;color:#0F766E;font-weight:600;margin-top:4px}
.controls{margin:8px 0}
select{width:100%;padding:10px 12px;border:1px solid rgba(15,118,110,.25);border-radius:8px;background:#fff;color:#1A1A1A;font-size:.9375rem;font-family:inherit;appearance:auto}
.countdown{text-align:center;padding:14px 0;font-size:1.75rem;font-weight:700;color:#0F766E;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;min-height:2.5rem}
.prayer-grid{border-top:1px solid rgba(0,0,0,.06)}
.prayer-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 4px;border-bottom:1px solid rgba(0,0,0,.06);font-size:1rem;font-weight:500;align-items:center}
.prayer-row.active{background:rgba(15,118,110,.1);border-radius:6px}
.prayer-row.active .label{font-weight:700}
.prayer-row .time{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:1.0625rem}
.imsak-row{padding:6px 4px;font-size:.8125rem;color:#555;border-bottom:1px solid rgba(0,0,0,.04)}
footer{text-align:center;font-size:.6875rem;color:#888;padding:16px 0 24px;line-height:1.5}
a{color:#888;text-decoration:underline}
.hidden{display:none!important}
.err{text-align:center;padding:24px 16px;color:#c0392b;font-size:.9375rem}
.err button{margin-top:12px;padding:8px 18px;background:#0F766E;color:#fff;border:none;border-radius:6px;font-size:.9375rem;font-family:inherit;cursor:pointer}
.loader{text-align:center;padding:24px 0;font-size:1rem;color:#0F766E}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🕌 Waktu Solat Malaysia</h1>
  <p class="subtitle" id="subtitle">Memuatkan…</p>
  <p class="hijri"  id="hijri">—</p>
</header>

<div class="controls">
  <select id="zoneSelect" aria-label="Pilih zon JAKIM">
    <option disabled>Memuatkan zon…</option>
  </select>
</div>

<p class="countdown hidden" id="countdown">Solat seterusnya: — dalam —</p>
<div class="prayer-grid" id="grid">
  <div class="loader" id="loader">Memuatkan data JAKIM…</div>
</div>
<footer>Sumber: <a href="https://github.com/abualif120/malaysia-waktu-solat-dataset" target="_blank" rel="noopener">JAKIM e-Solat</a> (via abualif120/malaysia-waktu-solat-dataset, CC BY 4.0)</footer>
</div>

<script>
(()=>{
'use strict';

// ─── Constants ───────────────────────────────────────
const BM_DAY  =['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];
const BM_MON  =['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
const BM_HIJRI=['Muharram','Safar','Rabiulawal','Rabiulakhir','Jamadilawal','Jamadilakhir','Rejab','Syaaban','Ramadan','Syawal','Zulkaedah','Zulhijjah'];
const SRC_CHANNEL='https://raw.githubusercontent.com/abualif120/malaysia-waktu-solat-dataset/main';

const YEAR = new Date().getFullYear();

function pad(n){return String(n).padStart(2,'0')}
function fmtBMDate(d){return `${BM_DAY[d.getDay()]}, ${d.getDate()} ${BM_MON[d.getMonth()]} ${d.getFullYear()}`}
function todayISO(){return `${new Date().getFullYear()}-${pad(new Date().getMonth()+1)}-${pad(new Date().getDate())}`}
function cacheKeyYear(){return 'wsl_pt_'+YEAR}

// ─── State ───────────────────────────────────────────
let zones=[], tarikhRows=[], ptRows=[], currentZone='SGR01';
let _timer=null;
let _dataLoaded=false;

// ─── Storage ─────────────────────────────────────────
const ls = {
  get(key, def){ try { return JSON.parse(localStorage.getItem(key)) ?? def } catch { return def } },
  set(key, val){ try { localStorage.setItem(key, JSON.stringify(val)) } catch {} }
};

function dataOK(){
  return ls.get('wsl_year') === YEAR
    && Array.isArray(zones) && zones.length
    && Array.isArray(ptRows) && ptRows.length;
}

// ─── Fetch ───────────────────────────────────────────
async function fetchJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error(`HTTP ${r.status} for ${url}`);
  return r.json();
}

async function loadAll(){
  const [z, t, p] = await Promise.all([
    fetchJSON(`${SRC_CHANNEL}/data/zones.json`),
    fetchJSON(`${SRC_CHANNEL}/data/tarikh.json`),
    fetchJSON(`${SRC_CHANNEL}/data/by_year/prayer_times_${YEAR}.json`)
  ]);
  zones = z.zones || [];
  tarikhRows = (t.tarikh || t.rows || []).map(r => ({
    gregorian: r.gregorian,
    hijri: r.hijri,
    day: r.day
  }));
  ptRows = (p.prayer_times || p.rows || []).map(r => ({
    zone: r.zone,
    date: r.date,
    day: r.day,
    imsak:   r.imsak   || '',
    subuh:   r.subuh   || '',
    syuruk:  r.syuruk  || '',
    dhuha:   r.dhuha   || '',
    zohor:   r.zohor   || '',
    asar:    r.asar    || '',
    maghrib: r.maghrib || '',
    isyak:   r.isyak   || ''
  }));

  ls.set('wsl_zones',   {ts: Date.now(), v: zones});
  ls.set('wsl_tarikh',  {ts: Date.now(), v: tarikhRows});
  ls.set(cacheKeyYear(),{ts: Date.now(), v: ptRows});
  ls.set('wsl_year',    YEAR);
  _dataLoaded = true;
}

function loadFromCache(){
  const cz = ls.get('wsl_zones');   if(cz) zones   = cz.v || zones;
  const ct = ls.get('wsl_tarikh');  if(ct) tarikhRows = ct.v || tarikhRows;
  const cp = ls.get(cacheKeyYear()); if(cp) ptRows  = cp.v || ptRows;
  const sv = ls.get('wsl_zone') || 'SGR01';
  currentZone = zones.find(z => z.zone === sv) ? sv : 'SGR01';
}

// ─── Helpers ─────────────────────────────────────────
function $p(s){ return document.querySelector(s) }

function getHijri(){
  const iso = todayISO();
  const e = tarikhRows.find(t => t.gregorian === iso);
  if(!e) return '—';
  const [y,m,d] = e.hijri.split('-').map(Number);
  return `${d} ${BM_HIJRI[m-1]} ${y}H`;
}

function parseMin(str){
  if(!str) return null;
  const [h,mi] = str.split(':').map(Number);
  return isNaN(h) || isNaN(mi) ? null : h*60+mi;
}

function nowMins(){ return new Date().getHours()*60 + new Date().getMinutes() }

function getTodayRow(){
  const iso = todayISO();
  let row = ptRows.find(r => r.date === iso && r.zone === currentZone);
  if(row) return row;
  // after midnight, try tomorrow
  const d = new Date(); d.setDate(d.getDate()+1);
  const tmrw = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  row = ptRows.find(r => r.date === tmrw && r.zone === currentZone);
  return row || null;
}

function getActiveAndNext(row){
  if(!row) return {active:null, next:{name:'Subuh',tomorrow:true}};
  const entries=['Imsak','Subuh','Syuruk','Zohor','Asar','Maghrib','Isyak']
    .map(n=>({name:n, mins: parseMin(row[n])}))
    .filter(e => e.mins !== null);
  if(entries.length < 2) return {active:null, next:{name:'Subuh',tomorrow:true}};
  const nm = nowMins();
  let active=entries[0], next=entries[1];
  // advance active to last that has passed
  for(let i=0;i<entries.length;i++){
    if(entries[i].mins <= nm) active=entries[i];
    if(entries[i].mins > nm){ next=entries[i]; break; }
  }
  // past last prayer: next is tomorrow's first
  if(entries[entries.length-1].mins <= nm) return {active, next:{name:'Subuh',tomorrow:true}};
  return {active, next};
}

function countdownStr(targetMins){
  const nm = nowMins();
  let diff = targetMins - nm;
  if(diff <= 0) diff += 1440;
  const h=Math.floor(diff/60), m=diff%60, s=60-new Date().getSeconds()%60;
  const sc = s===60 ? 0 : s ;
  return `${pad(h)}:${pad(m)}:${pad(sc)}`;
}

// ─── Render ───────────────────────────────────────────
function renderSubtitle(){
  $p('#subtitle').textContent = fmtBMDate(new Date());
}

function renderHijri(){
  $p('#hijri').textContent = getHijri();
}

function renderZoneSelect(){
  const sel = $p('#zoneSelect');
  sel.innerHTML = '';
  const groups = {};
  zones.forEach(z => { (groups[z.state] || (groups[z.state]=[])).push(z) });
  Object.keys(groups).sort().forEach(state => {
    const og = document.createElement('optgroup');
    og.label = state;
    groups[state].forEach(z => {
      const o = document.createElement('option');
      o.value = z.zone;
      o.textContent = z.zone + ' — ' + z.location;
      og.appendChild(o);
    });
    sel.appendChild(og);
  });
  const found = zones.find(z => z.zone === currentZone);
  currentZone = found ? currentZone : 'SGR01';
  sel.value = currentZone;
  // restore saved zone if it still exists
  const saved = ls.get('wsl_zone');
  if(saved && zones.find(z => z.zone === saved)) currentZone = saved;
  sel.value = currentZone;
}

let _activePrayerName = null;
let _nextPrayer = null;

function renderGrid(){
  const grid = $p('#grid');
  const cd   = $p('#countdown');

  if(YEAR > 2027){
    grid.innerHTML = '<div class="err">Data JAKIM hanya sampai 2027-12-31. Sila tunggu update.</div>';
    cd.classList.add('hidden'); return;
  }

  const row = getTodayRow();
  if(!row){
    grid.innerHTML = '<div class="err">Tiada data untuk zon ini. Sila pilih zon lain.</div>';
    cd.classList.add('hidden'); return;
  }

  grid.innerHTML = '';
  if(row.imsak){
    const d = document.createElement('div');
    d.className = 'imsak-row';
    d.textContent = `${row.imsak}  Imsak`;
    grid.appendChild(d);
  }

  const display=['Subuh','Syuruk','Zohor','Asar','Maghrib','Isyak'];
  const {active, next} = getActiveAndNext(row);
  _activePrayerName = active ? active.name : null;
  _nextPrayer = next;

  display.forEach(name=>{
    // key is lowercase in the row object
    const time = row[name.toLowerCase()] || '—';
    const isActive = active && active.name === name;
    const d = document.createElement('div');
    d.className = 'prayer-row' + (isActive ? ' active' : '');
    d.innerHTML = `<span class="label">${name}</span><span class="time">${time}</span>`;
    grid.appendChild(d);
  });

  cd.classList.remove('hidden');
  function tick(){
    if(_nextPrayer.tomorrow){
      cd.textContent='Solat seterusnya: Subuh dalam —'; return;
    }
    cd.textContent='Solat seterusnya: '+_nextPrayer.name+' dalam '+countdownStr(_nextPrayer.mins);
  }
  if(_timer) clearInterval(_timer);
  tick();
  _timer = setInterval(tick, 1000);
}

// ─── Init ─────────────────────────────────────────────
async function init(){
  renderSubtitle();
  const loader = $p('#loader');
  const errDiv = document.createElement('div');
  errDiv.className = 'err';

  try{
    if(!_dataLoaded && !dataOK()){
      await loadAll();
    }else{
      loadFromCache();
      _dataLoaded = true;
    }
    renderSubtitle(); renderHijri(); renderZoneSelect();
    renderGrid();
    loader.classList.add('hidden');

    $p('#zoneSelect').addEventListener('change', e=>{
      currentZone = e.target.value;
      ls.set('wsl_zone', currentZone);
      renderGrid();
    });

    // re-render clock each second (midnight rollover)
    setInterval(()=>{ if(_dataLoaded){ renderSubtitle(); renderHijri(); renderGrid(); } }, 1000);
  }catch(e){
    loader.classList.add('hidden');
    errDiv.innerHTML=
      '<div>❌ Gagal memuat data JAKIM.</div>' +
      '<div>Sila semak sambungan internet dan cuba semula.</div>' +
      '<button onclick="location.reload()">🔄 Cuba semula</button>';
    document.getElementById('grid').appendChild(errDiv);
    $p('#countdown').classList.add('hidden');
  }
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
</body>
</html>
